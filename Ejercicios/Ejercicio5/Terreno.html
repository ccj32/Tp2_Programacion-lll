<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de Área de Terreno</title>
  <link rel="stylesheet" href="Terreno.css">
  <script src="Terreno.js"></script>
    
</head>
<body>

  <h2>Calculadora de Área de Terreno (Forma A)</h2>

  <label for="a">Altura total (A) en metros:</label>
  <input type="number" id="a" step="any">

  <label for="b">Base (B) en metros:</label>
  <input type="number" id="b" step="any">

  <label for="c">Altura del rectángulo (C) en metros:</label>
  <input type="number" id="c" step="any">

  <button onclick="calcularArea()">Calcular Área</button>

  <div id="resultado"></div>

</body>
</html>
